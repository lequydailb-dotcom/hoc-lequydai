<script>
const C=window.COURSE;document.getElementById('zl').href=C.zalo;
const KEY='vanhanh-agent-done',TK='vh-token';let FULL=null,WHO='',NOTOWN=false;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return window['__'+k]}}
async function api(body){const r=await fetch(window.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});return r.json()}
async function boot(){const t=ls(TK);if(t){try{const r=await api({action:'content',token:t,course:'vanhanh'});if(r.ok){FULL=r.lessons;WHO=r.name;NOTOWN=false;const sv=(r.progress&&r.progress.done)||[];setDone(sv);if(r.progress&&r.progress.doneAt)ls(KEY+'-at',r.progress.doneAt)}else if(r.notOwned){NOTOWN=true;WHO=r.name}else ls(TK,null)}catch(e){}}
 document.getElementById('out').style.display=(FULL||NOTOWN)?'inline-block':'none';render()}
function logout(){ls(TK,null);FULL=null;NOTOWN=false;document.getElementById('out').style.display='none';go('');render()}
async function doLogin(ev){ev.preventDefault();const f=ev.target,m=f.querySelector('.msg'),b=f.querySelector('button');m.className='msg';m.textContent='Đang đăng nhập…';b.disabled=true;
 try{const r=await api({action:'login',email:f.email.value,password:f.pw.value});if(!r.ok){m.textContent=r.msg;b.disabled=false;return}ls(TK,r.token);m.className='msg ok';m.textContent='Đăng nhập thành công!';await boot()}catch(e){m.textContent='Không kết nối được, anh/chị thử lại.';b.disabled=false}}
async function doReset(){const f=document.getElementById('lf'),m=f.querySelector('.msg');if(!f.email.value){m.textContent='Nhập email đã đăng ký trước, rồi bấm lại "Quên mật khẩu".';return}
 m.className='msg';m.textContent='Đang gửi…';try{const r=await api({action:'reset',email:f.email.value});m.className='msg ok';m.textContent=r.msg}catch(e){m.textContent='Không kết nối được, anh/chị thử lại.'}}
function gate(){document.getElementById('crumb').innerHTML='<b>VẬN HÀNH AGENT</b> · Khu vực học viên';
 let h=`<div class="hero"><img src="/img/hero.jpg?v=20261105" alt="VẬN HÀNH AGENT – Trợ lý AI làm việc tự động theo não của bạn"></div><div class="introv"><h2>Video giới thiệu khoá học</h2><video  controls playsinline preload="metadata" poster="/video/poster-van-hanh.jpg?v=20261105"><source src="/video/gioi-thieu-van-hanh-agent.mp4?v=20261105" type="video/mp4"></video></div><div class="gate"><main>`;
 h+=`<div class="part" style="padding:22px 24px"><h2 style="margin:0 0 6px;font-size:22px">Khoá học này dành cho ai?</h2><p style="margin:0 0 14px;line-height:1.6">Dành cho người làm chủ, bán hàng, làm nội dung muốn có <b>đội nhân viên AI làm việc thay mình</b> mà không cần biết code.</p><h2 style="margin:0 0 10px;font-size:20px">Học xong bạn có</h2><div class="gi"><div>🧠 Một trợ lý AI nhớ bạn là ai, bán gì, nói giọng nào</div><div>📲 Giao việc bằng một câu nhắn Zalo hoặc Telegram</div><div>⏰ Tự làm đúng giờ: báo cáo, nhắc việc, việc nền</div><div>💬 Chatbot trả lời khách đúng bảng giá</div><div>☁️ Chạy 24/7 trên tên miền riêng của bạn</div><div>🎬 Mỗi bài có video hướng dẫn ngắn và câu lệnh chép sẵn</div></div><p class="small" style="margin-top:14px">16 bài cầm tay chỉ việc. Nội dung từng bài mở ra sau khi đăng ký và đăng nhập.</p></div>`;
h+=`</main><aside>${NOTOWN?`<div class="login"><h2>Xin chào ${WHO} 👋</h2><div class="small">Tài khoản của anh/chị chưa mở khoá này. Đăng ký bằng đúng email này, thanh toán xong khoá sẽ tự mở.</div><button class="btn" onclick="logout()" style="background:#5d6785">Đăng nhập tài khoản khác</button></div>`:`<form class="login" id="lf" onsubmit="doLogin(event)"><h2>Đăng nhập để học</h2><div class="small">Dùng email và mật khẩu trong thư chào mừng.</div>
 <input name="email" type="email" placeholder="Email đã đăng ký" required autocomplete="email"><input name="pw" type="password" placeholder="Mật khẩu" required autocomplete="current-password">
 <button class="btn y" type="submit">VÀO HỌC</button><div class="msg"></div><a class="lk" onclick="doReset()">Quên mật khẩu?</a></form>`}
 <div class="buy">Chưa có tài khoản?<br>Trọn khoá 16 bài chỉ <b>1.990.000đ</b><a class="btn" href="/dang-ky/">XEM KHOÁ HỌC & ĐĂNG KÝ</a></div></aside></div>`;return h}
function getDone(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return window.__d||[]}}
function setDone(a){window.__d=a;try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
const pad=n=>String(n).padStart(2,'0');
const SLUG='van-hanh',PID='vanhanh',NL=16;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.style.display='none',3500)}
function unlocked(i){const d=getDone();return i===1||d.includes(i)||d.includes(i-1)}
function lab(i){return 'Bài '+pad(i)}
function doneAt(){return ls(KEY+'-at')||''}
let __sync=null;function syncProg(){clearTimeout(__sync);__sync=setTimeout(async()=>{const t=ls(TK);if(!t)return;try{const r=await api({action:'progress',token:t,course:PID,done:getDone()});if(r&&r.doneAt)ls(KEY+'-at',r.doneAt)}catch(e){}},400)}
function vk(i){return 'vp-'+SLUG+'-'+i}
function vget(i){try{return JSON.parse(ls(vk(i))||'{}')}catch(e){return {}}}
function vset(i,o){ls(vk(i),JSON.stringify(o))}
function ck(i){try{return JSON.parse(ls('ck-'+SLUG+'-'+i)||'[]')}catch(e){return []}}
function lessonReady(i,L){const v=vget(i),c=ck(i);return {video:!!v.w,pct:Math.min(100,Math.round(v.p||0)),checks:c.filter(Boolean).length,total:L.check.length}}
function updGate(i){const L={...C.lessons[i],...FULL[i]};const st=lessonReady(i,L);const g=document.getElementById('gk');if(!g)return;
 g.querySelector('.r1').className='r r1'+(st.video?' ok':'');g.querySelector('.r1 span').textContent=st.video?'Đã xem hết video':'Xem hết video hướng dẫn ('+st.pct+'%)';g.querySelector('.bar b').style.width=(st.video?100:st.pct)+'%';
 g.querySelector('.r2').className='r r2'+(st.checks>=st.total?' ok':'');g.querySelector('.r2 span').textContent='Tích đủ ô tự kiểm tra ('+st.checks+'/'+st.total+')';
 const nq=(L.quiz||[]).length,ans=document.querySelectorAll('#qz input:checked').length;const r3=g.querySelector('.r3');if(r3){r3.style.display=nq?'flex':'none';r3.querySelector('span').textContent='Trả lời trắc nghiệm ('+ans+'/'+nq+' câu)';r3.className='r r3'+(nq&&ans>=nq?' ok':'')}
 const b=document.getElementById('cpl');if(b)b.disabled=!(st.video&&st.checks>=st.total&&ans>=nq)}
function wire(i){const L={...C.lessons[i],...FULL[i]};const done=getDone().includes(i);
 document.querySelectorAll('.chk input').forEach((x,k)=>{const c=ck(i);x.checked=!!c[k]||done;x.onchange=()=>{const c=ck(i);c[k]=x.checked;ls('ck-'+SLUG+'-'+i,JSON.stringify(c));updGate(i)}});
 document.querySelectorAll('#qz input').forEach(x=>x.onchange=()=>{x.closest('.qq').classList.remove('bad');updGate(i)});
 const v=document.getElementById('lv');if(!v)return;const st=vget(i);let last=0;
 v.addEventListener('loadedmetadata',()=>{if(st.pos&&st.pos<v.duration-3)v.currentTime=st.pos},{once:true});
 v.addEventListener('error',()=>{const o=vget(i);o.w=1;vset(i,o);updGate(i)});
 v.addEventListener('seeking',()=>{const o=vget(i);if(done||o.w)return;const mx=o.m||0;if(v.currentTime>mx+1.5){v.currentTime=mx;const n=document.getElementById('vnote');n.style.display='block';setTimeout(()=>n.style.display='none',3500)}});
 v.addEventListener('timeupdate',()=>{const o=vget(i);if(!v.seeking&&v.currentTime<=(o.m||0)+2)o.m=Math.max(o.m||0,v.currentTime);o.pos=v.currentTime;if(v.duration){o.p=100*(o.m||0)/v.duration;if((o.m||0)>=v.duration*0.9)o.w=1}if(Date.now()-last>1500||o.w&&!st.w){last=Date.now();vset(i,o);st.w=o.w;updGate(i)}});
 v.addEventListener('ended',()=>{const o=vget(i);o.w=1;o.pos=0;vset(i,o);updGate(i)});
 updGate(i)}
async function complete(i){const L={...C.lessons[i],...FULL[i]};const st=lessonReady(i,L);const nq=(L.quiz||[]).length;
 const ans=[...Array(nq)].map((_,k)=>{const x=document.querySelector(`#qz input[name="q${k}"]:checked`);return x?+x.value:-1});
 if(!(st.video&&st.checks>=st.total)||ans.includes(-1)){toast('Xem hết video, tích đủ ô tự kiểm tra và trả lời trắc nghiệm trước nhé.');return}
 const b=document.getElementById('cpl');const bt=b.textContent;b.disabled=true;b.textContent='Đang chấm…';
 let r=null;try{r=await api({action:'quiz',token:ls(TK),course:PID,lesson:i,answers:ans})}catch(e){}
 if(!r||!r.ok){b.disabled=false;b.textContent=bt;if(r&&r.login){toast('Phiên đăng nhập đã hết, đăng nhập lại nhé.');logout()}else toast((r&&r.msg)||'Mạng chập chờn, bấm lại giúp mình nhé.');return}
 if(!r.pass){b.disabled=false;b.textContent=bt;(r.wrong||[]).forEach(k=>{const q=document.querySelector(`.qq[data-k="${k}"]`);if(q)q.classList.add('bad')});const q0=document.querySelector('.qq.bad');if(q0)q0.scrollIntoView({behavior:'smooth',block:'center'});toast('Có '+(r.wrong||[]).length+' câu chưa đúng. Xem lại rồi chọn lại nhé.');return}
 setDone(r.done||[...getDone(),i]);if(r.doneAt)ls(KEY+'-at',r.doneAt);
 if(i<NL){toast('🎉 Chính xác! Đã mở '+lab(i+1));go('bai-'+(i+1))}else{toast('🎓 Chúc mừng bạn đã hoàn thành khoá học!');go('chung-nhan')}}
function cert(){const d=getDone();if(d.length<NL){setTimeout(()=>go(''));return ''}
 document.getElementById('crumb').innerHTML=`<span style="cursor:pointer" onclick="go('')">${C.title||'VẬN HÀNH AGENT'}</span> / <b>Chứng nhận hoàn thành</b>`;
 const at=doneAt()?new Date(doneAt()):new Date();const code=(PID==='vibe'?'VC':'VH')+'-'+at.getFullYear()+String(at.getMonth()+1).padStart(2,'0')+String(at.getDate()).padStart(2,'0')+'-'+String([...(WHO||'x')].reduce((a,ch)=>(a*31+ch.charCodeAt(0))%9000,7)+1000);
 return `<div class="cert"><img src="/img/logo-duong.png" alt="ĐẠI LÊ AI"><div class="t">CHỨNG NHẬN HOÀN THÀNH</div><h1>VẬN HÀNH AGENT</h1><div>Chứng nhận học viên</div><div class="n">${WHO||'Học viên'}</div><div class="c">đã hoàn thành toàn bộ ${NL} bài và bài kiểm tra cuối khoá</div>
 <div class="m"><div>Ngày hoàn thành<b>${at.toLocaleDateString('vi-VN')}</b></div><div>Mã chứng nhận<b>${code}</b></div><div>Đồng hành<b>ĐẠI LÊ AI</b></div></div></div>
 <div style="text-align:center;margin:10px 0 40px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><button class="btn y" style="width:auto;padding:12px 28px" onclick="window.print()">In / Lưu PDF</button><button class="btn" style="width:auto;padding:12px 28px" onclick="go('')">Về trang khoá học</button></div>`}

const strip=h=>h.replace(/<[^>]+>/g,'');
function go(h){location.hash=h}
function sidebar(){const d=getDone(),p=Math.round(d.length/16*100);
 return `<aside><div class="box"><img src="/img/cover-square.jpg" alt="VẬN HÀNH AGENT"><div class="prog"><i style="width:${p}%"></i></div><div class="small">${d.length}/16 bài đã hoàn thành · ${p}%</div>
 ${d.length>=NL?`<button class="btn y" onclick="go('chung-nhan')">🎓 Nhận chứng nhận</button>`:`<button class="btn y" onclick="go('bai-'+${nextIdx()})">${d.length?'Học tiếp':'Bắt đầu khoá học'}</button>`}
 ${WHO?`<div class="small" style="margin-top:10px">Xin chào <b>${WHO}</b> 👋</div>`:''}<div style="margin-top:16px;font-weight:800">Người đồng hành</div><div class="teacher"><img src="/img/dai-1.jpg" alt="Đại Lê"><div><b>ĐẠI LÊ AI</b><div class="small">hoc.lequydai.com</div></div></div>
 <a class="btn" href="${C.zalo}" target="_blank" rel="noopener">Vào nhóm Zalo hỏi đáp</a></div></aside>`}
function nextIdx(){const d=getDone();for(let i=1;i<=16;i++)if(!d.includes(i))return i;return 1}
function home(){document.getElementById('crumb').innerHTML='<b>VẬN HÀNH AGENT</b> · Trợ lý AI làm việc tự động theo não của bạn';
 let h=`<div class="hero"><img src="/img/hero.jpg?v=20261105" alt="VẬN HÀNH AGENT – Trợ lý AI làm việc tự động theo não của bạn"><button class="go" onclick="go('bai-'+${nextIdx()})">${getDone().length?'Học tiếp ▶':'Bắt đầu khoá học ▶'}</button></div><div class="introv"><h2>Video giới thiệu khoá học</h2><video  controls playsinline preload="metadata" poster="/video/poster-van-hanh.jpg?v=20261105"><source src="/video/gioi-thieu-van-hanh-agent.mp4?v=20261105" type="video/mp4"></video></div><div class="grid"><main>`;
 const d=getDone();
 C.parts.forEach(pt=>{h+=`<div class="part"><h2>${pt.name}</h2>`;pt.lessons.forEach(i=>{const L=C.lessons[i];
  {const ok=unlocked(i),dn=d.includes(i),cur=ok&&!dn;h+=`<div class="ls ${ok?'':'lockd'}" onclick="${ok?`go('bai-${i}')`:`toast('🔒 Hoàn thành bài trước để mở bài này nhé.')`}"><img src="/img/bai-${pad(i)}.jpg" alt="Bài ${pad(i)}" loading="lazy"><div style="flex:1"><h3>Bài ${pad(i)}. ${L.title}</h3><p>Sau bài này: ${strip(L.goal)}</p></div>${cur?'<span class="now">Đang học</span>':''}<span class="dn ${dn?'on':''}"></span></div>`}});h+=`</div>`});
 h+=`</main>${sidebar()}</div>`;return h}
function lesson(i){const L0=C.lessons[i];if(!L0||!FULL||!FULL[i])return home();if(!unlocked(i)){setTimeout(()=>{toast('🔒 Học lần lượt nhé: hoàn thành bài trước để mở bài này.');go('bai-'+nextIdx())});return ''}const L={...L0,...FULL[i]};const d=getDone(),isDone=d.includes(i);
 const part=C.parts.find(p=>p.lessons.includes(i));
 document.getElementById('crumb').innerHTML=`<span style="cursor:pointer" onclick="go('')">VẬN HÀNH AGENT</span> / <b>Bài ${pad(i)}. ${L.title}</b>`;
 let h=`<div class="grid"><main><div class="lesson"><img class="cv" src="/img/bai-${pad(i)}.jpg" alt="Bài ${pad(i)}"><div class="small">${part.name}</div><h1>Bài ${pad(i)}. ${L.title}</h1>
 <div class="goal"><b>Sau bài này bạn có:</b> ${L.goal}</div><div class="lv"><h3>🎬 Video hướng dẫn bài này</h3><video id="lv" controls playsinline controlslist="nodownload" preload="metadata" src="/video/bai/van-hanh-${pad(i)}.mp4?v=20261105"></video><div class="vnote" id="vnote">Xem lần lượt nhé, chưa tua qua đoạn chưa xem được.</div></div>${L.html}
 <div class="task"><h3>✍️ Bài tập</h3>${L.task}<h3 style="margin-top:14px!important">✅ Tự kiểm tra</h3><div class="chk">${L.check.map((c,k)=>`<label><input type="checkbox">${c}</label>`).join('')}</div></div>
 <p style="margin-top:18px"><b>${L.next}</b></p>
 ${!isDone&&L.quiz&&L.quiz.length?`<div class="qz" id="qz"><h3>📝 Trắc nghiệm nhanh</h3><div class="small">Trả lời đúng ${L.quiz.length} câu để mở bài tiếp theo.</div>${L.quiz.map((q,k)=>`<div class="qq" data-k="${k}"><b>${k+1}. ${q[0]}</b>${q[1].map((o,j)=>`<label><input type="radio" name="q${k}" value="${j}"><span>${o}</span></label>`).join('')}<div class="qw">Chưa đúng, xem lại bài rồi chọn lại nhé.</div></div>`).join('')}</div>`:''}
 ${isDone?'':`<div class="gk" id="gk"><h3>🔓 Để mở bài tiếp theo</h3><div class="r r1"><i>✓</i><span></span></div><div class="bar"><b></b></div><div class="r r2"><i>✓</i><span></span></div><div class="r r3"><i>✓</i><span></span></div></div>`}
 <div class="nav">${i>1?`<button class="btn" style="background:#5d6785" onclick="go('bai-${i-1}')">◀ ${lab(i-1)}</button>`:''}
 ${isDone?`<button class="btn done" disabled style="opacity:1;cursor:default">✓ Đã hoàn thành</button>${i<NL?`<button class="btn" onclick="go('bai-${i+1}')">${lab(i+1)} ▶</button>`:`<button class="btn y" onclick="go('chung-nhan')">🎓 Nhận chứng nhận</button>`}`:`<button class="btn y" id="cpl" disabled onclick="complete(${i})">${i<NL?'Nộp bài & mở '+lab(i+1)+' ▶':'Nộp bài & hoàn thành khoá 🎓'}</button>`}</div></div></main>${sidebar()}</div>`;return h}
function toggle(i){complete(i)}
function render(){const m=location.hash.match(/bai-(\d+)/);document.getElementById('app').innerHTML=!FULL?gate():location.hash.includes('chung-nhan')?cert():m?lesson(+m[1]):home();if(FULL&&m&&unlocked(+m[1]))setTimeout(()=>wire(+m[1]));window.scrollTo(0,0);
 document.querySelectorAll('pre').forEach(p=>{const b=document.createElement('button');b.className='cp';b.textContent='Chép';b.onclick=()=>{const t=p.childNodes[0].textContent;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{b.textContent='Đã chép'},()=>{b.textContent='Bôi đen để chép'})};p.appendChild(b)})}
window.addEventListener('hashchange',render);boot();
</script>
